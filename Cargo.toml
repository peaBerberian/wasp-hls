[package]
name = "wasp-hls"
version = "0.6.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "src/rs-core/lib.rs"

[features]
# Standalone handles exist only in the isolated test/benchmark artifact.
transmux-test-api = []

[dependencies]
thiserror = "2.0.21"

